<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Heart sound report</title>
<style>
/* Screen: the app's dark palette. Print: light and ink-saving. One accent for heart sounds, amber only for things that need attention. */
:root{--bg:#1b2430;--panel:#253141;--line:#3a4a5e;--grid:#33435a;--fg:#edf1f5;--dim:#a2b0c0;--acc:#7cc8a4;--amber:#f0b45a;--mute:#8090a4;
--mono:ui-monospace,"Roboto Mono","Droid Sans Mono",monospace;--ui:"Roboto Condensed","sans-serif-condensed",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--ui)}
#page{max-width:980px;margin:auto;padding:12px 16px 40px}
h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 2px}h3{font-size:15px;margin:0 0 6px;font-weight:600}
p{margin:0 0 8px}a{color:var(--acc)}
#top{display:flex;gap:8px;align-items:center;margin-bottom:10px}#top h1{flex:1}
button{font:inherit;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;min-height:44px;padding:0 12px}
button:active{background:var(--line)}button:focus-visible,summary:focus-visible,.spot:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.sub{color:var(--dim);font-size:14px;overflow-wrap:anywhere}
.not{border:1px solid var(--line);border-radius:4px;padding:6px 10px;color:var(--dim);font-size:13px;margin:10px 0}
.level{margin-top:22px;border-top:2px solid var(--line);padding-top:12px}
.lead{color:var(--dim);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0;min-width:0}
.full{margin-bottom:12px}
.col{display:contents}.o3{order:3}.o4{order:4}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.tile .k{color:var(--dim);font-size:13px;line-height:1.2;min-height:2.4em}
.tile .v{font-size:34px;font-weight:600;line-height:1.15}.tile .u{color:var(--dim);font-size:13px}
details{font-size:13px}summary{color:var(--dim);cursor:pointer;min-height:28px;display:flex;align-items:center;gap:4px;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"+";display:inline-block;width:14px;text-align:center;border:1px solid var(--line);border-radius:3px;line-height:14px;font-size:12px}
details[open]>summary::before{content:"–"}details>div{color:var(--fg);padding:2px 0 6px}
.how{color:var(--dim);font-size:13px;margin:6px 0 0}.how b{color:var(--fg);font-weight:600}
.flag{font-size:17px;font-weight:600;display:flex;gap:8px;align-items:flex-start}.flag i{flex:none;width:14px;height:14px;margin-top:5px;border-radius:50%;background:var(--acc)}
.flag.on i{background:var(--amber);border-radius:2px;transform:rotate(45deg)}.flag.na i{background:none;border:2px solid var(--mute)}
.caveat{color:var(--dim);font-size:14px;margin:4px 0 0 22px}
ul{margin:0;padding-left:20px}li{margin-bottom:4px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}th{color:var(--dim);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
.scroll{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:4px}.scroll table{font-size:12px}.scroll td,.scroll th{padding:3px 4px}.scroll th{position:sticky;top:0;background:var(--panel)}
.warn{color:var(--amber)}
.box{border-left:3px solid var(--amber);padding:2px 0 2px 10px;font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-bottom:2px}.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:18px;height:10px}
svg.ch{display:block;width:100%;height:auto;touch-action:pan-y;font-family:var(--ui)}
svg text{fill:var(--dim);font-size:10px}svg text.lbl{fill:var(--fg);font-weight:600}
.ax{stroke:var(--line);stroke-width:1;fill:none}.gr{stroke:var(--grid);stroke-width:1;fill:none}.grm{stroke:var(--grid);stroke-width:.5;fill:none;opacity:.55}
.ln{stroke:var(--acc);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}.ln.thin{stroke-width:.7;opacity:.3}
.fill{fill:var(--acc);stroke:none}.band{fill:var(--acc);opacity:.22;stroke:none}.wash{fill:var(--acc);opacity:.14;stroke:none}
.mu{stroke:var(--mute);stroke-width:1.5;fill:none;stroke-linejoin:round}.muf{fill:var(--mute)}
.dot{fill:var(--acc);stroke:var(--panel);stroke-width:1.5}.odd{fill:var(--amber);stroke:var(--panel);stroke-width:1.5}.oddl{stroke:var(--amber);stroke-width:1.1;fill:none;opacity:.9}
.tk{stroke:var(--acc);stroke-width:1}.cross{stroke:var(--fg);stroke-width:1;opacity:0;pointer-events:none}
.brk{stroke:var(--dim);stroke-width:1;fill:none}
#tip{position:fixed;z-index:9;pointer-events:none;background:#0f151d;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12px;color:var(--fg);max-width:220px;display:none}
#tip b{display:block;font-size:13px}
.spot{fill:var(--panel);stroke:var(--dim);stroke-width:1.5;cursor:pointer}.spot.sel{fill:var(--acc);stroke:var(--acc)}
.body{stroke:var(--mute);stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.cond{display:flex;gap:12px;align-items:flex-start}.cond svg{flex:none;width:112px}.cond dl{flex:1;min-width:0}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px}dt{color:var(--dim)}dd{margin:0;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{flex:1 1 auto}
.primer{display:grid;grid-template-columns:1fr;gap:12px}.primer .card{display:flex;gap:10px;align-items:flex-start}.primer svg{flex:none;width:92px;height:auto}.primer p{font-size:14px;margin:0}
.imgd{display:block}.imgp{display:none}.po{display:none}
#msg{color:var(--amber);min-height:20px;font-size:14px;margin-top:6px;overflow-wrap:anywhere}
#load{padding:40px 0;text-align:center;color:var(--dim)}
[hidden]{display:none!important}
@media (min-width:700px){.col{min-width:0;display:flex;flex-direction:column;gap:12px}.grid2{grid-template-columns:1fr 1fr}.primer{grid-template-columns:1fr 1fr}.tile .k{min-height:0}}
@media print{
 :root{--bg:#fff;--panel:#fff;--line:#b8bfc7;--grid:#d5dae0;--fg:#111;--dim:#444;--acc:#0a7d5a;--amber:#b85e00;--mute:#777;color-scheme:light}
 @page{size:A4;margin:9mm 12mm}
 html,body{font-size:9.3pt;line-height:1.28;background:#fff}#page{max-width:none;padding:0}
 .np,#tip,summary::before{display:none!important}
 .tile details:not([open]){display:none}
 h1{font-size:15pt}h2{font-size:12.5pt}h3{font-size:10pt;margin-bottom:3px}
 .level{break-before:page;margin-top:0;border-top:0;padding-top:0}#l1{break-before:auto;margin-top:8px}
 .grid2{display:block;column-count:2;column-gap:7px;margin-bottom:0}.grid2>.card{margin-bottom:7px}.grid2.cols{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}.col{min-width:0;display:flex;flex-direction:column;gap:7px}.primer{grid-template-columns:1fr 1fr;gap:7px}
 .card,.tile{break-inside:avoid;padding:5px 8px;border-radius:3px}.full{margin-bottom:7px}
 th,td{padding:2px 5px}summary{min-height:0}
 .tile .v{font-size:24pt}.tile .k{min-height:0}.tile .k,.tile .u,.how,.sub,th,.legend,.caveat,.box,dl,table,.primer p{font-size:8.4pt}
 .box p{display:inline}.how{margin-top:3px}.lead{margin-bottom:6px}.flag{font-size:11pt}
 .scroll{max-height:none;overflow:visible;border:0}.so{display:none}.po{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.po table{font-size:6.6pt}.po td,.po th{padding:1px 3px;font-size:6.6pt;white-space:nowrap}
 .imgd{display:none}.imgp{display:block}
 .primer svg{width:64px}.cond svg{width:74px}.how{font-size:8pt}
 #primer{break-before:auto;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
}
</style></head><body>
<div id="page">
  <div id="top"><button id="back" class="np" aria-label="Back to recordings">‹ Back</button><h1>Heart sound report</h1><button id="pdf" class="np">PDF</button></div>
  <div id="load">Preparing the report…</div>
  <div id="pick" hidden class="card"><p>Open a report file (JSON) saved from Heart Sounds.</p><input type="file" id="file" accept=".json,application/json"></div>
  <div id="msg" class="np" role="status"></div>
  <div id="rep" hidden></div>
</div>
<div id="tip"></div>
<script>
"use strict";
// The page draws one JSON object (see Report.java). It needs no app: window.REPORT_DATA or a picked file works in any browser.
// Inside the app, an optional window.ReportHost supplies the data and handles saving, printing and the chest position.
const $ = id => document.getElementById(id), host = window.ReportHost || null;
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fx = (v, d) => v == null || isNaN(v) ? "–" : v.toFixed(d === undefined ? 1 : d);
const sg = (v, d) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d === undefined ? 1 : d);
const clock = t => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
const path = pts => pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
const median = a => { if (!a.length) return null; const c = a.slice().sort((x, y) => x - y); return c[Math.round(0.5 * (c.length - 1))]; };
const say = t => { $("msg").textContent = t || ""; };
const ODD = ["", "timing", "knock or loud noise", "different shape"], ODD_S = ["", "timing", "knock", "shape"];
const SPOTS = { ur: ["Upper right of the breastbone", "aortic area", 47, 50], ul: ["Upper left of the breastbone", "pulmonary area", 73, 50], ll: ["Lower left of the breastbone", "tricuspid area", 71, 80], apex: ["Lower left chest, below the nipple", "apex, mitral area", 90, 93] };
let D = null, wide = false, printing = false;

// ---------- charts: each returns {html, probe}; probe(x, y) in drawing units gives the tooltip for that spot ----------
const svg = (w, h, label, inner) => `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${inner}<line class="cross" x1="0" y1="0" x2="0" y2="0"/></svg>`;
const txt = (x, y, s, anchor, cls) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}"${anchor ? ` text-anchor="${anchor}"` : ""}${cls ? ` class="${cls}"` : ""}>${esc(s)}</text>`;
const vline = (x, y0, y1, cls) => `<line class="${cls}" x1="${x.toFixed(1)}" y1="${y0}" x2="${x.toFixed(1)}" y2="${y1}"/>`;
const hline = (y, x0, x1, cls) => `<line class="${cls}" x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}"/>`;
const diamond = (x, y, r, cls) => `<path class="${cls}" d="M${x.toFixed(1)} ${(y - r).toFixed(1)}l${r} ${r}l${-r} ${r}l${-r} ${-r}z"/>`;

/** One panel of the typical beat: middle line and middle-half band. */
function beatPanel(b, band, x0, x1, y0, y1) {
  const s = b[band], n = s.mid.length, total = (n - 1) * b.step, top = Math.max(...s.q3, 1e-6) * 1.1;
  const X = t => x0 + (t + b.pre) / total * (x1 - x0), Y = v => y1 - Math.min(1, v / top) * (y1 - y0), T = i => i * b.step - b.pre;
  let g = "";
  for (let t = -0.1; t < total - b.pre + 1e-6; t += 0.1) g += vline(X(t), y0, y1, "gr");
  g += `<path class="band" d="${path(s.q3.map((v, i) => [X(T(i)), Y(v)]))}${path(s.q1.map((v, i) => [X(T(i)), Y(v)]).reverse()).replace("M", "L")}z"/>`;
  g += `<path class="ln" d="${path(s.mid.map((v, i) => [X(T(i)), Y(v)]))}"/>` + hline(y1, x0, x1, "ax");
  return { g, X, Y, T, total, top, n };
}
function beatSimple(b) {
  const W = 360, H = 176, p = beatPanel(b, "lo", 6, 354, 10, 108); let g = p.g;
  const marks = [[0, "S1"], [b.s1s2, "S2"], [b.cycle, "S1"]];
  for (const [t, l] of marks) g += txt(p.X(t), 124, l, "middle", "lbl");
  const br = (ta, tb, l1, l2) => { const a = p.X(ta) + 9, c = p.X(tb) - 9, m = (a + c) / 2; return `<path class="brk" d="M${a.toFixed(1)} 131v6H${c.toFixed(1)}v-6"/>` + txt(m, 151, l1, "middle", "lbl") + txt(m, 164, l2, "middle"); };
  g += br(0, b.s1s2, "gap 1 · " + fx(b.s1s2, 2) + " s", "squeeze (systole)") + br(b.s1s2, b.cycle, "gap 2 · " + fx(b.cycle - b.s1s2, 2) + " s", "refill (diastole)");
  return { html: svg(W, H, "Typical beat with the first and second heart sound and the two gaps", g), probe: (x) => { const i = Math.max(0, Math.min(p.n - 1, Math.round((x - 6) / 348 * (p.n - 1)))); return { x: p.X(p.T(i)), y0: 10, y1: 108, head: fx(p.T(i), 2) + " s from S1", rows: ["loudness " + fx(b.lo.mid[i], 0) + " (middle half " + fx(b.lo.q1[i], 0) + "–" + fx(b.lo.q3[i], 0) + ")"] }; } };
}
function beatBands(b) {
  const W = 360, H = 206, a = beatPanel(b, "lo", 30, 354, 14, 76), c = beatPanel(b, "hi", 30, 354, 116, 178); let g = a.g + c.g;
  g += txt(32, 11, "40–200 Hz · heart sounds") + txt(32, 112, "150–600 Hz · where murmurs tend to show");
  for (const p of [a, c]) g += txt(26, p.Y(p.top / 1.1) + 3, fx(p.top / 1.1, p.top < 20 ? 1 : 0), "end") + txt(26, p.Y(0), "0", "end");
  for (let t = 0; t < a.total - b.pre + 1e-6; t += 0.2) g += txt(a.X(t), 191, fx(t, 1), a.X(t) > 344 ? "end" : "middle");
  g += txt(354, 203, "seconds from S1", "end");
  for (const [t, l] of [[0, "S1"], [b.s1s2, "S2"], [b.cycle, "S1"]]) g += vline(a.X(t), 78, 82, "tk") + txt(a.X(t), 92, l, "middle", "lbl");
  return { html: svg(W, H, "Typical beat in two frequency bands", g), probe: (x) => { const i = Math.max(0, Math.min(a.n - 1, Math.round((x - 30) / 324 * (a.n - 1)))); return { x: a.X(a.T(i)), y0: 14, y1: 178, head: fx(a.T(i), 2) + " s from S1", rows: ["40–200 Hz: " + fx(b.lo.mid[i], 1), "150–600 Hz: " + fx(b.hi.mid[i], 2)] }; } };
}
/** Sound trace of the cleanest 10 seconds in rows of 5 s, on a 0.2 s / 0.04 s grid, with S1 and S2 on every beat. */
function strip(d) {
  const s = d.strip, n = s.min.length, dur = n * s.step, per = 5, rows = Math.max(1, Math.ceil(dur / per - 1e-9)), W = wide ? 720 : 360, rh = wide ? 58 : 74, x0 = 4, x1 = W - 4, H = rows * (rh + 26) + 2;
  let g = "";
  for (let r = 0; r < rows; r++) {
    const top = r * (rh + 26) + 12, bot = top + rh, mid = (top + bot) / 2, ta = r * per, X = t => x0 + (t - ta) / per * (x1 - x0), Y = v => mid - v / 1000 * (rh / 2 - 2);
    for (let i = 0; i <= per * 25; i++) { const x = X(ta + i * 0.04); g += vline(x, top, bot, i % 5 ? "grm" : "gr"); }
    for (let i = 0; i <= per; i++) g += txt(X(ta + i), bot + 11, clock(s.t0 + ta + i) + (i === 0 ? " min:s" : ""), i === 0 ? "start" : i === per ? "end" : "middle");
    g += hline(mid, x0, x1, "ax");
    const a = Math.round(ta / s.step), b = Math.min(n, Math.round((ta + per) / s.step)); if (b <= a) continue;
    let up = "", dn = "";
    for (let i = a; i < b; i++) { const x = X(i * s.step + s.step / 2).toFixed(1); up += (i === a ? "M" : "L") + x + " " + Y(s.max[i]).toFixed(1); dn = "L" + x + " " + Y(s.min[i]).toFixed(1) + dn; }
    g += `<path class="fill" d="${up}${dn}z"/>`;
    for (const [arr, l] of [[d.marks.s1, "S1"], [d.marks.s2, "S2"]]) for (const t of arr) { const u = t - s.t0 - 0.025; if (u < ta || u >= ta + per || u > dur) continue; g += vline(X(u), top - 3, top + 3, "tk") + txt(X(u), top - 4, l, "middle", l === "S1" ? "lbl" : ""); }
  }
  return { html: svg(W, H, "Sound trace of the cleanest 10 seconds with first and second heart sounds marked", g), probe: (x, y) => { const r = Math.max(0, Math.min(rows - 1, Math.floor(y / (rh + 26)))), t = r * per + (Math.max(x0, Math.min(x1, x)) - x0) / (x1 - x0) * per, top = r * (rh + 26) + 12; return { x: Math.max(x0, Math.min(x1, x)), y0: top, y1: top + rh, head: fx(s.t0 + t, 2) + " s into the recording", rows: [] }; } };
}
/** Whole recording: loudness on top, one mark per beat below. */
function rhythm(d) {
  const W = wide ? 720 : 360, x0 = 30, x1 = W - 6, X = t => x0 + t / d.seconds * (x1 - x0), o = d.over, b = d.beats, rel = d.a.reliable; let g = "", pts = [];
  const oy0 = 12, oy1 = wide ? 36 : 46;
  if (o) { let p = `M${X(o.t0).toFixed(1)} ${oy1}`; o.v.forEach((v, i) => { p += "L" + X(o.t0 + (i + 0.5) * o.step).toFixed(1) + " " + (oy1 - v / 1000 * (oy1 - oy0)).toFixed(1); }); g += `<path class="wash" d="${p}L${X(o.t0 + o.v.length * o.step).toFixed(1)} ${oy1}z"/><path class="ln" style="stroke-width:1" d="${p.replace(/^M[^L]*L/, "M")}"/>`; }
  g += txt(x0, 9, "loudness, 40–200 Hz") + hline(oy1, x0, x1, "ax");
  const y0 = oy1 + 16, y1 = wide ? 98 : 132, H = rel ? y1 + 18 : 66;
  const step = d.seconds <= 20 ? 2 : d.seconds <= 45 ? 5 : d.seconds <= 120 ? 10 : 30;
  for (let t = 0; t <= d.seconds; t += step) g += vline(X(t), oy1, oy1 + 3, "ax") + (rel ? vline(X(t), y0, y1, "gr") : "") + txt(X(t), (rel ? y1 : oy1) + 13, clock(t), X(t) > x1 - 12 ? "end" : "middle");
  if (rel) {
    const rates = b.len.map(l => l > 0 ? 60 / l : null), med = d.a.rate, lo = Math.max(0, Math.min(med * 0.75, ...rates.filter(v => v !== null && v > med * 0.5))), hi = Math.max(med * 1.25, ...rates.filter(v => v !== null && v < med * 1.6)), Y = r => y1 - (Math.max(lo, Math.min(hi, r)) - lo) / (hi - lo) * (y1 - y0);
    g += hline(Y(med), x0, x1, "ax") + txt(x0 - 4, Y(med) + 3, fx(med, 0), "end") + txt(x0 - 4, y0 + 6, fx(hi, 0), "end") + txt(x0 - 4, y1, fx(lo, 0), "end") + txt(x0, y0 - 4, "beats per minute, beat by beat");
    let k = 0, later = "";
    b.t.forEach((t, i) => {
      const y = rates[i] === null ? Y(med) : Y(rates[i]);
      if (b.odd[i]) { k++; later += diamond(X(t), y, 5, "odd") + txt(X(t), y - 8, String(k), "middle", "lbl"); pts.push([X(t), y, clock(t) + " · unusual beat " + k, [ODD[b.odd[i]], rates[i] === null ? "length not measured" : fx(rates[i], 0) + " per minute"]]); }
      else if (rates[i] !== null) { g += `<circle class="dot" cx="${X(t).toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`; pts.push([X(t), y, clock(t), [fx(rates[i], 0) + " per minute", "beat length " + fx(b.len[i], 2) + " s"]]); }
    });
    g += later;
  } else for (const t of d.marks.s1) g += vline(X(t), oy1 - 5, oy1, "mu");
  return { html: svg(W, H, "Rhythm of the whole recording, one mark per beat", g), probe: (x, y) => { let best = null, bd = 1e9; for (const p of pts) { const q = Math.abs(p[0] - x) + 0.3 * Math.abs(p[1] - y); if (q < bd) { bd = q; best = p; } } return best && bd < 40 ? { x: best[0], y0: y0, y1: y1, head: best[2], rows: best[3] } : null; } };
}
/** Spectrogram as two small images (screen and print colours) inside the drawing, 0 to 600 Hz. */

  if (d.spec) h += card("c_spec", "Average spectrum", "Level in each " + fx(d.spec.binHz, 1) + " Hz bin against a full-scale tone. Where the green line rises above the grey one, the sound comes and goes with the beats. The fall at the left edge is the microphone losing low pitches; it is the phone, not the heart.", `<div class="legend"><span><svg viewBox="0 0 18 10"><line class="ln" x1="1" y1="5" x2="17" y2="5"/></svg>whole recording</span><span><svg viewBox="0 0 18 10"><line class="mu" x1="1" y1="5" x2="17" y2="5"/></svg>quietest quarter (background)</span></div>`);

  if (lens.length >= 3) h += card("c_hist", "Beat lengths", "How many beats had each length, in 0.02 s steps. One narrow pile is a steady rhythm. A second pile or a long tail means some beats were longer or shorter, or were missed by the beat finder.")
    + card("c_poin", "Each beat against the next", "Each dot plots one beat’s length against the following one. A tight cluster on the diagonal is a steady rhythm; a stretch along it is slow change such as breathing; dots far from it are single odd beats or detection errors.", nOdd ? `<div class="legend"><span><svg viewBox="0 0 18 10"><circle class="dot" cx="9" cy="5" r="3.5"/></svg>pair of beats</span><span><svg viewBox="0 0 18 10"><path class="odd" d="M9 0l5 5l-5 5l-5-5z"/></svg>includes an unusual beat</span></div>` : "");
  if (d.overlay && d.overlay.rows.length) h += card("c_over", "All beats lined up on S1", "One thin line per beat, loudness in the 40–200 Hz band (" + d.overlay.rows.length + (d.overlay.total > d.overlay.rows.length ? " of " + d.overlay.total : "") + " beats). Lines that stack tightly mean the beats repeat well. S2 looks smeared when the S1–S2 time varies. Stray lines are single beats that differ" + (d.overlay.odd.some(Boolean) ? "; amber ones were marked unusual." : "."));
  h += `</div>`;
  if (nb) {
    const head = `<tr><th class="n">#</th><th class="n">time</th><th class="n">length</th><th class="n">S1–S2</th><th class="n">gap 1</th><th class="n">gap 2</th><th class="n">flag</th><th>note</th></tr>`, B = d.beats;
    const tr = i => `<tr><td class="n">${i + 1}</td><td class="n">${fx(B.t[i], 2)}</td><td class="n">${B.len[i] > 0 ? fx(B.len[i], 2) : "–"}</td><td class="n">${fx(B.gap[i], 2)}</td><td class="n">${sg(B.sysHi[i])}</td><td class="n">${sg(B.diaHi[i])}</td><td class="n">${sg(B.flagDb[i])}</td><td>${B.odd[i] ? `<span class="warn">${ODD_S[B.odd[i]]}</span>` : B.ok[i] ? "" : "missing"}</td></tr>`;
    let all = ""; for (let i = 0; i < nb; i++) all += tr(i);
    const lim = Math.min(nb, 120), per = Math.ceil(lim / 3); let cols = "";
    for (let c = 0; c < 3; c++) { let rs = ""; for (let i = c * per; i < Math.min(lim, (c + 1) * per); i++) rs += tr(i); if (rs) cols += `<table>${head}${rs}</table>`; }
    h += `<div class="full"><figure class="card"><h3>Every beat</h3><div class="scroll so"><table>${head}${all}</table></div><div class="po">${cols}</div>`
      + how("One row per beat: time of S1, length to the next S1 and S1–S2 time in seconds; level in each gap in dB (150–600 Hz, relative to that beat’s heart sounds); and the flag measure in dB (gap 1 against gap 2)." + (nb > 120 ? " The printed table shows the first 120 beats; the CSV has all " + nb + "." : "") + " Notes: timing = unusual length, knock = knock or loud noise, shape = unusual shape, missing = a heart sound was not found. A dash means not measured.") + `</figure></div>`;
  }
  h += `<div class="grid2"><div class="card"><h3>Method</h3><p class="how" style="margin:0;color:var(--fg)">Raw 16-bit recording, low-passed and reduced to ${fx(d.fs, 0)} Hz; the first 0.3 s is skipped. Loudness curves: 4th-order Butterworth band-pass 40–200 Hz and 150–600 Hz, rectified, smoothed at 20 Hz, 5 ms steps. Beat length from the autocorrelation of the 40–200 Hz curve; beats tracked from the strongest peak; the shorter gap is taken as S1–S2. Typical beat: median and quartiles over beats lined up on S1. Flag: median over beats of the 150–600 Hz level in the S1–S2 gap against the S2–S1 gap, at least +${fx(a.limitDb, 0)} dB. Spectrum: 512-point Hann frames, loudest 2% left out. Spectrogram: 256-point Hann frames every 16 ms.</p>
<p class="how">Validation on CirCor DigiScope stethoscope recordings (children): beats found reliably in 90% of 1,749 recordings, rate within 5 per minute in 89% of those; on 829 held-out recordings the flag marked 59% of murmurs and 4% of recordings without one. Not validated on phones. Details: ${host ? "docs/validation.md in the project repository" : `<a href="https://github.com/jacekkotowski/apk-heart-sounds/blob/main/docs/validation.md">docs/validation.md</a>`}. Report format ${d.v}, app ${esc(d.app)}.</p></div>
<div class="card np"><h3>Export</h3><div class="btns"><button id="x_pdf">Report as PDF</button>${host && host.sharePdf ? `<button id="x_share">Share PDF</button>` : ""}<button id="x_csv">Per-beat CSV</button><button id="x_json">Everything as JSON</button></div><p class="how">${host ? "CSV and JSON go to Download/HeartSounds. PDF opens Android’s print screen: choose “Save as PDF”." : "PDF opens the print dialog: choose “Save as PDF”."}</p></div></div></section>`;

  // Primer
  h += `<section class="level" id="primer"><h2>Heart sounds in two minutes</h2><p class="lead">A short guide to what the report is about.</p><div class="primer">
<div class="card"><svg viewBox="0 0 92 70"><path class="body" d="M46 62C20 44 10 32 14 20q4-10 16-8q9 2 16 12q7-10 16-12q12-2 16 8q4 12-32 42z"/><path class="ln" d="M4 66h10l3-9l4 14l3-5h18l3-6l3 9l2-3h38" style="stroke-width:1.5"/><text x="18" y="54" class="lbl">S1</text><text x="43" y="57" class="lbl">S2</text></svg><p><b>What makes the two sounds.</b> A heartbeat is “lub-dub”. The first sound (S1) comes when the valves between the upper and lower chambers shut as the heart starts to squeeze. The second (S2) comes when the outlet valves shut as it relaxes.</p></div>
<div class="card"><svg viewBox="0 0 92 70"><path class="ln" style="stroke-width:1.5" d="M4 36h8l2-16l3 30l3-22l2 8h4"/><path class="oddl" d="M26 36l2-4l2 7l2-6l2 5l2-6l2 7l2-5l2 4l2-5l2 6l2-4l2 3"/><path class="ln" style="stroke-width:1.5" d="M54 36l2-12l3 22l3-14l2 4h24"/><text x="8" y="64" class="lbl">S1</text><text x="38" y="14" text-anchor="middle">murmur</text><text x="56" y="64" class="lbl">S2</text></svg><p><b>What a murmur is.</b> A murmur is a whooshing sound of blood flowing, heard between the heart sounds. Many are harmless, especially in children and in fit or pregnant adults. Some come from a valve that is narrow or leaks. The sound alone does not say which; a doctor does.</p></div>
<div class="card"><svg viewBox="0 0 92 70"><path class="ax" d="M10 6v50h78"/><path class="mu" d="M10 20h56q10 0 16 22"/><path class="ln" d="M12 56q8-34 22-36h34q9 0 14 22"/><text x="14" y="16">stethoscope</text><text x="40" y="34" class="lbl">phone</text><text x="88" y="67" text-anchor="end">low pitch → high</text></svg><p><b>Why a phone hears less.</b> Heart sounds are very low-pitched, mostly 20 to 150 Hz. A stethoscope is built for that range. A phone microphone is built for voices and fades out below about 50 to 100 Hz, so it catches only the upper part and adds more noise.</p></div>
<div class="card">${chest("ll", false).replace("<svg ", '<svg style="width:92px" ')}<p><b>How to get a better recording.</b> Quiet room, sitting or lying still. Press the phone’s bottom edge on bare skin, just left of the breastbone between the ribs. Breathe gently or hold your breath for a few seconds. Do not rub or shift the phone. Use the same spot each time so recordings can be compared.</p></div>
</div></section>`;
  return h;
}

function mount(id, c) {
  const el = $(id); if (!el || !c) return; el.innerHTML = c.html; if (!c.probe) return;
  const s = el.querySelector("svg"), cross = s.querySelector(".cross"), tip = $("tip");
  const hide = () => { cross.style.opacity = 0; tip.style.display = "none"; };
  const mv = ev => {
    const r = s.getBoundingClientRect(), vb = s.viewBox.baseVal, p = c.probe((ev.clientX - r.left) / r.width * vb.width, (ev.clientY - r.top) / r.height * vb.height);
    if (!p) { hide(); return; }
    cross.setAttribute("x1", p.x); cross.setAttribute("x2", p.x); cross.setAttribute("y1", p.y0); cross.setAttribute("y2", p.y1); cross.style.opacity = 0.6;
    tip.textContent = ""; const hd = document.createElement("b"); hd.textContent = p.head; tip.append(hd); for (const t of p.rows) { const e = document.createElement("div"); e.textContent = t; tip.append(e); }
    tip.style.display = "block"; const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(4, Math.min(window.innerWidth - tw - 4, ev.clientX + 12)) + "px"; tip.style.top = Math.max(4, ev.clientY - th - 12) + "px";
  };
  s.addEventListener("pointermove", mv); s.addEventListener("pointerdown", mv); s.addEventListener("pointerleave", hide); s.addEventListener("pointercancel", hide);
}
function drawCharts() {
  const d = D, rel = d.a.reliable;
  if (rel && d.beat) mount("c_beat", beatSimple(d.beat));
  if ($("c_over1")) mount("c_over1", rhythm({ seconds: d.seconds, over: d.over, beats: d.beats, a: { reliable: false }, marks: { s1: [] } }));
  if (d.strip) mount("c_strip", strip(rel ? d : Object.assign({}, d, { marks: { s1: [], s2: [] } })));
  mount("c_rhythm", rhythm(d));
  if (d.beat) mount("c_bands", beatBands(d.beat));
  if (d.sgram) mount("c_sgram", sgram(rel ? d : Object.assign({}, d, { marks: { s1: [], s2: [] } })));
  if (d.spec) mount("c_spec", spectrum(d));
  if ($("c_hist")) { mount("c_hist", histogram(d)); mount("c_poin", poincare(d)); }
  if ($("c_over")) mount("c_over", overlay(d));
  drawChest();
}
function drawChest() {
  const pos = (D.rec || {}).pos || "", can = !!(host && host.setPosition), el = $("c_chest"); el.innerHTML = chest(pos, can);
  $("posname").textContent = SPOTS[pos] ? SPOTS[pos][0] + " (" + SPOTS[pos][1] + ")" : "not recorded";
  if (can) for (const c of el.querySelectorAll(".spot")) { const set = () => { D.rec.pos = c.dataset.pos; host.setPosition(D.rec.name, c.dataset.pos); drawChest(); }; c.addEventListener("click", set); c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") set(); }); }
}
function setWide() { const w = printing || window.innerWidth >= 700; if (w !== wide) { wide = w; if (D) drawCharts(); } }

// ---------- exports ----------
function csv() {
  const B = D.beats, v = x => x == null ? "" : x, rows = ["beat,time_s,length_s,s1_s2_s,both_sounds_found,gap1_low_db,gap2_low_db,gap1_high_db,gap2_high_db,flag_measure_db,unusual"];
  for (let i = 0; i < B.t.length; i++) rows.push([i + 1, B.t[i], B.len[i] > 0 ? B.len[i] : "", v(B.gap[i]), B.ok[i], v(B.sysLo[i]), v(B.diaLo[i]), v(B.sysHi[i]), v(B.diaHi[i]), v(B.flagDb[i]), ODD[B.odd[i]]].join(","));
  return rows.join("\n") + "\n";
}
function save(suffix, mime, text) {
  const file = String((D.rec || {}).name || "recording").replace(/\.wav$/, "") + suffix;
  if (host && host.save) { host.save(file, mime, text); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = file; document.body.append(a); a.click(); a.remove();
}
function pdf() { const job = String((D.rec || {}).name || "recording").replace(/\.wav$/, "") + "_report"; if (host && host.print) host.print(job); else window.print(); }

function show(data) {
  D = data; wide = window.innerWidth >= 700;
  $("load").hidden = true; $("pick").hidden = true; const rep = $("rep"); rep.innerHTML = build(); rep.hidden = false; drawCharts();
  document.title = "Heart sound report · " + String((D.rec || {}).name || "").replace(/\.wav$/, "");
  $("x_pdf").addEventListener("click", pdf); $("x_csv").addEventListener("click", () => save("_beats.csv", "text/csv", csv())); $("x_json").addEventListener("click", () => save("_report.json", "application/json", JSON.stringify(D)));
  if ($("x_share")) $("x_share").addEventListener("click", () => host.sharePdf(String(D.rec.name || "recording").replace(/\.wav$/, "") + "_report"));
  window.__ready = true;
}
$("pdf").addEventListener("click", () => { if (D) pdf(); });
$("back").addEventListener("click", () => { if (history.length > 1) history.back(); else location.href = "index.html"; });
window.addEventListener("resize", setWide);
window.addEventListener("beforeprint", () => { printing = true; setWide(); });
window.addEventListener("afterprint", () => { printing = false; setWide(); });
$("file").addEventListener("change", ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(t => show(JSON.parse(t))).catch(() => say("That file is not a Heart Sounds report.")); });
if (window.REPORT_DATA) show(window.REPORT_DATA);
else if (host && location.hash.length > 1) {
  const name = decodeURIComponent(location.hash.slice(1)); host.start(name);
  const t = setInterval(() => {
    const m = host.message ? host.message() : null; if (m) say(m);
    const j = host.poll(); if (!j || j === "null") return;
    clearInterval(t); const o = JSON.parse(j);
    if (o.error) { $("load").textContent = "The report could not be made: " + o.error; return; }
    show(o); setInterval(() => { const n = host.message ? host.message() : null; if (n) say(n); }, 400);
  }, 150);
} else { $("load").hidden = true; $("pick").hidden = false; $("pdf").hidden = true; if (!host) $("back").hidden = true; }
</script></body></html>
